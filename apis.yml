aid: sweatcoin
name: Sweatcoin
description: Sweatcoin is a health-and-fitness app that converts a user's physical
  steps and movement into a digital currency ("sweatcoins") that can be redeemed for
  gadgets, subscriptions, travel vouchers, charity donations, and cryptocurrency.
  Its proprietary movement-validation algorithms count outdoor steps while, the company
  states, not selling location data. Sweatcoin reports being a top-3 health & fitness
  app worldwide with tens of millions of users across 180+ countries, and partners
  with brands and organizations (NHS, Apple, Amazon and 600+ others) through sponsored
  challenges, clubs, boosts and an affiliate marketplace. The team also launched the
  Sweat Economy ($SWEAT), a NEAR-Protocol "movement economy" token, and the Sweat
  Wallet app, turning tracked movement into on-chain digital value. Sweatcoin exposes
  no public REST/OpenAPI developer surface; integration is via partner and marketplace
  programs and the SWEAT on-chain token.
